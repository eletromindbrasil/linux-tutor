name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-tutor-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Eletromind VPS
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://linux.eletrovps.com

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5

      - name: Build, deploy and validate through Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
        run: python3 scripts/deploy-production.py
